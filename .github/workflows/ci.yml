name: CI

on:
  # Main pushes call this workflow from publish-nuget.yml so each commit is tested only once.
  pull_request:
  workflow_call:
    outputs:
      package-version:
        description: NuGet version of the package in the nupkg artifact
        value: ${{ jobs.pack.outputs.version }}
      version-bumped:
        description: True when a main push increases VersionPrefix to the packed version
        value: ${{ jobs.pack.outputs.version-bumped }}

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Zakira.Replay.slnx

      - name: Build
        run: dotnet build Zakira.Replay.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test Zakira.Replay.slnx --no-build --configuration Release --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ matrix.os }}
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore

  pack:
    name: pack (smoke)
    runs-on: ubuntu-latest
    needs: test
    outputs:
      version: ${{ steps.pack.outputs.version }}
      version-bumped: ${{ steps.bump.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The previous tip can be several commits behind HEAD in a single push.
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      - name: Pack
        id: pack
        run: |
          project=src/Zakira.Replay/Zakira.Replay.csproj
          dotnet pack "$project" --configuration Release --output artifacts
          version=$(dotnet msbuild "$project" -p:Configuration=Release -getProperty:PackageVersion)
          test -s "artifacts/Zakira.Replay.$version.nupkg"
          test -s "artifacts/Zakira.Replay.$version.snupkg"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Detect a version bump across the push
        id: bump
        if: >-
          github.event_name == 'push' && github.ref == 'refs/heads/main' &&
          !github.event.created && !github.event.deleted && !github.event.forced
        shell: pwsh
        env:
          BEFORE_SHA: ${{ github.event.before }}
          PACKAGE_VERSION: ${{ steps.pack.outputs.version }}
        run: |
          function Read-VersionPrefix([xml]$props) {
            $prefix = $props.SelectSingleNode('/Project/PropertyGroup/VersionPrefix')
            return [semver]::Parse($prefix.InnerText.Trim())
          }

          $oldProps = git show "${env:BEFORE_SHA}:Directory.Build.props"
          if ($LASTEXITCODE -ne 0) { throw "Cannot read Directory.Build.props at $env:BEFORE_SHA" }
          $previous = Read-VersionPrefix ($oldProps -join "`n")
          $current = Read-VersionPrefix (Get-Content -Raw Directory.Build.props)
          Write-Host "VersionPrefix: $previous -> $current"
          if ($current -gt $previous) {
            if ($env:PACKAGE_VERSION -cne $current.ToString()) {
              throw "Packed version $env:PACKAGE_VERSION does not match VersionPrefix $current."
            }
            'changed=true' >> $env:GITHUB_OUTPUT
          }

      - name: Upload package and symbols
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nupkg
          path: |
            artifacts/Zakira.Replay.${{ steps.pack.outputs.version }}.nupkg
            artifacts/Zakira.Replay.${{ steps.pack.outputs.version }}.snupkg
          if-no-files-found: error
          compression-level: 0
