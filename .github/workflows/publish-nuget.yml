name: Publish to NuGet.org

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: nuget-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-latest
    environment: nuget.org
    permissions:
      id-token: write
    env:
      PACKAGE_VERSION: ${{ needs.ci.outputs.package-version }}
    steps:
      - name: Check release tag matches the packed version
        run: |
          if [[ "$GITHUB_REF_NAME" != "v$PACKAGE_VERSION" ]]; then
            echo "::error::Expected release tag v$PACKAGE_VERSION for this package."
            exit 1
          fi

      - name: Download the tested build's packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nupkg
          path: packages

      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      - name: Get a short-lived NuGet key via GitHub OIDC
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: login
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Publish package and companion symbols
        working-directory: packages
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          dotnet nuget push "Zakira.Replay.$PACKAGE_VERSION.nupkg" \
            --source https://api.nuget.org/v3/index.json \
            --api-key "$NUGET_API_KEY" --skip-duplicate
