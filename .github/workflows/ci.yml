name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    outputs:
      package-version:
        description: NuGet version of the package in the nupkg artifact
        value: ${{ jobs.pack.outputs.version }}

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Zakira.Replay.slnx

      - name: Build
        run: dotnet build Zakira.Replay.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test Zakira.Replay.slnx --no-build --configuration Release --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ matrix.os }}
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore

  pack:
    name: pack (smoke)
    runs-on: ubuntu-latest
    needs: test
    outputs:
      version: ${{ steps.pack.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      - name: Pack
        id: pack
        run: |
          project=src/Zakira.Replay/Zakira.Replay.csproj
          dotnet pack "$project" --configuration Release --output artifacts
          version=$(dotnet msbuild "$project" -p:Configuration=Release -getProperty:PackageVersion)
          test -s "artifacts/Zakira.Replay.$version.nupkg"
          test -s "artifacts/Zakira.Replay.$version.snupkg"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Upload package and symbols
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nupkg
          path: |
            artifacts/Zakira.Replay.${{ steps.pack.outputs.version }}.nupkg
            artifacts/Zakira.Replay.${{ steps.pack.outputs.version }}.snupkg
          if-no-files-found: error
          compression-level: 0
